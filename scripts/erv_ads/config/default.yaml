# carla-erv-ego defaults. Override with --config my.yaml and/or --set a.b=c

carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 30
  map: null                 # e.g. Town10HD_Opt, or your packaged RFS / San Ramon map; null = keep loaded map
  synchronous: true         # scenario runner owns the clock; ego_node/erv_broadcaster never change settings
  fixed_delta_s: 0.05       # 20 Hz physics/control
  tm_port: 8000
  spectator_follow: true

clock:
  kind: sim                 # sim (secMark from CARLA sim time, all processes agree) | wall (real OBUs)
  sim_epoch_utc: 1767225600 # 2026-01-01T00:00:00Z

ego:
  role_name: ego_av
  blueprint: ["vehicle.lincoln.mkz*", "vehicle.lincoln.*", "vehicle.tesla.*", "vehicle.*"]
  cruise_kmh: 45
  respect_speed_limits: true
  comfort_decel_mps2: 2.5
  full_brake_decel_mps2: 8.0
  edge_margin_m: 0.3
  use_shoulder: true
  pass_clearance_m: 1.0     # side gap kept to a stationary ERV being passed
  trace_hz: 10
  broadcast_bsm: true       # ego transmits its own BSM (basic profile) like any equipped vehicle
  bsm_rate_hz: 10

erv:
  role_name: erv_1
  kind: firetruck           # firetruck | ambulance | police | responder
  code3: true               # lightbar (CARLA Special1) on + siren flag in BSM
  speed_factor: 1.3         # x posted limit while responding
  max_kmh: 75
  junction_kmh: 30
  max_pass_offset_m: 3.8    # how far left of lane centre the ERV may move to pass a yielding vehicle
  bsm_rate_hz: 10
  bsm_profile: stol_sample  # stol_sample | full
  profile_overrides: {}     # e.g. {multi: multiVehicle, classification: 63}
  temp_id_rotation_s: 0     # 0 = fixed ID (typical for agency vehicles); 300 = J2945/1-like
  gnss_sigma_m: 0.8         # 1-sigma horizontal error; 0 disables
  gnss_tau_s: 30
  seed: 11

v2x:
  transport: inprocess      # inprocess | udp
  codec: auto               # auto (UPER if asn1/ has J2735, else JSON) | uper | json
  asn1_dir: asn1
  udp:
    erv_tx_host: 127.0.0.1  # where ERV BSMs are sent (ego listens here)
    erv_tx_port: 47347
    ego_rx_bind: 0.0.0.0
    ego_rx_port: 47347
    ego_tx_host: 127.0.0.1  # where the ego's own BSMs go (V2X Hub, logger, ...)
    ego_tx_port: 47348
    multicast_group: null
  channel:
    enabled: true           # set false when bytes come from real RF (OBU forwarding)
    d50_los_m: 450
    d50_nlos_m: 150
    slope_m: 50
    floor_per: 0.005
    latency_min_ms: 3
    latency_max_ms: 50
    raycast_los: true
    seed: 7

tracker:
  max_age_ms: 1000
  future_tolerance_ms: 200
  stale_s: 1.0
  drop_s: 3.0
  gate_m: 10.0
  gate_heading_deg: 30.0

policy:
  awareness_radius_m: 500
  yield_trigger_ttr_s: 12
  yield_trigger_range_m: 150
  oncoming_trigger_range_m: 200
  divided_oncoming_exempt: true
  junction_keepout_m: 25
  max_stop_decel_mps2: 4.0
  crossing_trigger_ttr_s: 10
  crossing_stop_range_m: 60
  move_over_trigger_m: 250
  move_over_pass_clear_m: 25
  slow_pass_kmh: 40
  slow_pass_below_limit_kmh: 25
  slow_pass_start_m: 100
  clear_distance_m: 15
  clear_delay_s: 3
  multi_vehicle_extra_hold_s: 6
  stale_hold_s: 5
  min_hold_s: 1
  resume_s: 3
  lane_change_timeout_s: 6
  borrow_opposing_lane: true      # pass a lane-blocking stationary ERV through the opposing lane when it is clear
  max_borrow_offset_m: 4.5
  borrow_start_m: 45
  blocked_stop_gap_m: 12

scenario:
  name: approach_from_behind  # approach_from_behind | stationary_ahead | oncoming | crossing
  erv_offset_m: 140           # spawn distance from ego (behind / ahead / upstream of junction)
  erv_start_delay_s: 6        # ego gets up to speed before the ERV is dispatched
  ego_route_m: 450
  max_duration_s: 120
  end_after_resume_s: 8
  background_vehicles: 15
  prefer_multilane: true
  seed: 3

evidence:
  out_dir: runs
  criteria:
    max_decel_mps2: 6.0
    min_range_at_action_m: 40
