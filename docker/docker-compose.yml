services:
  dt-core:
    container_name: dt-core
    image: harbor.distributedtesting.org/distributed-testing/dt-core:latest
    profiles: ["core"]
    tty: true 
    network_mode: "host"
    ipc: "host"
    environment:
      - DISPLAY=$DISPLAY
      - SDL_VIDEODRIVER=x11
      - XAUTHORITY=~/.Xauthority
      - VUG_CONTAINER_IMAGE=dt-core
      - VUG_SITE_CONFIG_FILE=${VUG_SITE_CONFIG_FILE}
      - VUG_SCENARIO_CONFIG_FILE=${VUG_SCENARIO_CONFIG_FILE}
      - VUG_VPN_LOCAL_ADDRESS=${VUG_VPN_LOCAL_ADDRESS}
      - VUG_VPN_EM_ADDRESS=${VUG_VPN_EM_ADDRESS}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${VUG_LOCAL_DT_PATH}:/home/dt_user/distributed-testing
    stop_grace_period: 30s
  
  dt-carla:
    container_name: dt-carla
    image: harbor.distributedtesting.org/distributed-testing/dt-carla:latest
    profiles: ["carla"]
    network_mode: "host"
    environment:
      - DISPLAY=$DISPLAY
      - SDL_VIDEODRIVER=x11
      - XAUTHORITY=~/.Xauthority
      - VUG_CONTAINER_IMAGE=dt-carla
      - VUG_SITE_CONFIG_FILE=${VUG_SITE_CONFIG_FILE}
      - VUG_SCENARIO_CONFIG_FILE=${VUG_SCENARIO_CONFIG_FILE}
      - VUG_VPN_LOCAL_ADDRESS=${VUG_VPN_LOCAL_ADDRESS}
      - VUG_VPN_EM_ADDRESS=${VUG_VPN_EM_ADDRESS}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${VUG_LOCAL_DT_PATH}:/home/carla/distributed-testing
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  dt-v2xhub:
    container_name: dt-v2xhub
    image: harbor.distributedtesting.org/distributed-testing/dt-v2xhub:latest
    profiles: ["v2xhub"]
    networks:
      v2xhub_data_internal:
      v2xhub_app_external:
        gw_priority: 100
      tena_lan:
        ipv4_address: ${TENA_LAN_IP}
        gw_priority: 10
    ports:
      # Command Plugin
      - "19760:19760"       # Command WebSocket

      # Message Receiver Plugin
      - "26780-26800:26700-26800/udp" # MessageReceiver (Range 26789 ±10)

      # SPaT Plugin
      - "6053:6053/udp"     # TSC sends UDP
      - "5050:5050/udp"     # SNMP polling

      # TIM Plugin
      - "10000:10000/tcp"   # TIM WebServicePort

      # CARMA Cloud Plugin
      - "22222:22222/tcp"

      # CDASim Adapter Plugin (simulation mode)
      - "6767:6767/udp"   # CDASim registration
      - "7575:7575/udp"   # time_sync
      - "5757:5757/udp"   # SIM_V2X (simulated V2X out)

      # MUST Sensor Driver Plugin
      - "4545:4545/udp"     # MUST detection receiver port

    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends on:
      db:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 2560
        hard: 2560
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory:  1g
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=IVP
      - MYSQL_USER=IVP
      - MYSQL_PASSWORD=/run/secrets/mysql_password
      - SIMULATION_MODE=${SIMULATION_MODE:-false}
      - SIMULATION_IP=${SIMULATION_IP:-127.0.0.1}
      - SIMULATION_REGISTRATION_PORT=6767
      - V2XHUB_IP=${V2XHUB_IP:-0.0.0.0}
      - TIME_SYNC_TOPIC=time_sync
      - TIME_SYNC_PORT=7575
      - SIM_V2X_PORT=5757
      - SIM_INTERACTION_PORT=7576
      - V2X_PORT=8686
      - INFRASTRUCTURE_ID=${INFRASTRUCTURE_ID:-rsu_1234}
      - INFRASTRUCTURE_NAME=${INFRASTRUCTURE_NAME:-East Intersection}
      - SENSOR_JSON_FILE_PATH=${SENSOR_JSON_FILE_PATH:-/var/www/download/sensors.json}
      - V2XHUB_USERNAME=${V2XHUB_USERNAME:-v2xadmin}
      - V2XHUB_PASSWORD=${V2XHUB_PASSWORD}
      - TZ=${TZ:-America/New_York}
    secrets:
      - mysql_password
    volumes:
      - v2xhub-logs-volume:/var/log/tmx:rw
      - v2xhub-download-volume:/var/www/download/:rw
      - ssl-certs-volume:/var/www/plugins/ssl:rw
      - ../container/service.sh:/usr/local/bin/service.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep -q tmxcore && ps -ef | grep -v grep | grep -q CommandPlugin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: mysql:8.0.40
    container_name: mysql
    profiles: ["v2xhub"]
    environment:
      - TZ=${TZ:-America/New_York}
      - MYSQL_DATEBASE=IVP
      - MYSQL_USER=IVP
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    networks:
      - v2xhub_data_internal
    secrets:
      - mysql_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "db", "-u", "IVP", "-p$$(cat /run/secrets/mysql_password)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./mysql/localhost.sql:/docker-entrypoint-initdb.d/localhost.sql
      - mysql-datavolume:/var/lib/mysql

  php:
    image: usdotfhwaops/php:${V2XHUB_VERSION:-develop}
    container_name: php
    profiles: ["v2xhub"]
    networks:
      - v2xhub_web_external
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - db
      - v2xhub
    stdin_open: true
    tty: true
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ssl-certs-volume:/etc/apache2/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -I http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  
  volumes:
    mysql-datavolume:
    ssl-certs-volume:
      # To access/set SSL certifications on host machine setup local mapping to ssl directory.
      # NOTE: Ensure directory exists and has non-root privileges before running
      # docker compose to prevent permission issues
      driver: local
      driver_opts:
        type: 'none'
        o: 'bind'
        device: '${V2XHUB_VOLUME_PATH:-/tmp/v2xhub_data}/ssl' # Specify the absolute path on your host
    v2xhub-download-volume:
      # To access V2X Hub uploaded files on host machine setup local mapping to download directory.
      # NOTE: Ensure directory exists and has non-root privileges before running
      # docker compose to prevent permission issues
      driver: local
      driver_opts:
        type: 'none'
        o: 'bind'
        device: '${V2XHUB_VOLUME_PATH:-/tmp/v2xhub_data}/download' # Specify the absolute path on your host
    v2xhub-logs-volume:
      # To access log files on host machine setup local mapping to logs directory.
      # NOTE: Ensure directory exists and has non-root privileges before running
      # docker compose to prevent permission issues
      driver: local
      driver_opts:
        type: 'none'
        o: 'bind'
        device: '${V2XHUB_VOLUME_PATH:-/tmp/v2xhub_data}/logs' # Specify the absolute path on your host

  # Networks: separated by purpose
  networks:
    v2xhub_web_external:
      driver: bridge
    v2xhub_app_external:
      driver: bridge
    v2xhub_data_internal:
      driver: bridge
      internal: true # No external internet access - only inter-service communication
    tena_lan:
      # Gives the v2xhub container its own address on the physical LAN, so the TENA
      # plugin can bind and advertise a routable endpoint to the Execution Manager.
      #
      # ipvlan (not macvlan) because the parent interface is wireless: 802.11
      # associates a single MAC per station, so macvlan's per-container MACs are
      # dropped by the access point. ipvlan 12 shares the parent's MAC and
      # distringuishes containers by IP alone
      driver: ipvlan
      driver_opts:
        parent: ${LAN_PARENT_IF}
        ipvlan_mode: 12
      ipam:
        config:
          - subnet: ${LAN_SUBNET}
            gateway: ${LAN_GATEWAY}
  secrets:
    mysql_password:
      file: ../secrets/mysql_password.txt