name: "CI"
on:
  workflow_dispatch:
  push:
    branches:
    - event/hass_dt_develop

  pull_request:
    branches:
      - event/hass_dt_develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  DOCKERHUB_NAMESPACE: harbor.distributedtesting.org

jobs:
  determine_docker_org_and_tag:
    runs-on: ubuntu-22.04
    steps:
      - name: Determine Docker organization and tag
        id: docker-org-and-tag
        uses: usdot-fhwa-stol/actions/docker-org-and-tag@main
    outputs: # Currently harcoding the docker org and tag since there is only one image repository and  supported base branch is currently only events/hass-dt-develop
      docker_org: dot-ostr-dt
      docker_tag: develop

  # Everything downstream (dt-core, dt-v2xhub) FROMs dt-base and/or builds against
  # dt-build-general, so both are built and pushed here as one shared prerequisite step.
  build-dt-base-general:
    runs-on: ubuntu-22.04
    needs: determine_docker_org_and_tag
    env:
      DOCKER_ORG: ${{ needs.determine_docker_org_and_tag.outputs.docker_org }}
      DOCKER_TAG: ${{ needs.determine_docker_org_and_tag.outputs.docker_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to DT Docker registry
        uses: docker/login-action@v3
        with:
          registry: harbor.distributedtesting.org
          username: ${{ secrets.KEYCLOAK_USERNAME }}
          password: ${{ secrets.KEYCLOAK_TOKEN }}

      # BUILD_DIR (per build-assets.env) is wiped with the rest of the runner after every job,
      # so without this, every run re-downloads every asset from the same handful of Google
      # Drive file IDs - which is what trips Drive's anonymous-link download quota. Keyed on the
      # env file so a version/ID bump busts the cache; restore-keys still gets a partial hit
      # (fetch-assets.sh downloads only whatever doesn't match) if just one entry changed.
      - name: Cache downloaded build assets
        uses: actions/cache@v4
        with:
          path: ~/distributed-testing/docker/build/lib/BUILD
          key: build-assets-${{ hashFiles('docker/build/build-assets.env') }}
          restore-keys: |
            build-assets-

      - name: Fetch required assets
        working-directory: ./docker/build
        run: |
          chmod +x fetch-assets.sh
          ./fetch-assets.sh build-assets.env
          source build-assets.env
          chmod -R a+rX "$BUILD_DIR"

      - name: Build dt-base image
        working-directory: ./docker/build
        run: |
          chmod +x build-image.sh
          ./build-image.sh base -v "$DOCKER_TAG"

      - name: Build dt-build-general image
        working-directory: ./docker/build
        env:
          USDOTFHWASTOL_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          chmod +x build-image.sh
          ./build-image.sh build-general -v "$DOCKER_TAG"

      # Pushed only after both images in this job built, since build-dt-core and build-dt-v2xhub
      # pull them back down from the registry. Skipped on pull_request:
      - name: Push images to DT registry
        if: github.event_name != 'pull_request'
        run: |
          fail=0

          for image in dt-base dt-build-general; do
            repo="${DOCKERHUB_NAMESPACE}/${DOCKER_ORG}/${image}"
            refs=$(docker images --format '{{.Repository}}:{{.Tag}}' "$repo")

            if [[ -z "$refs" ]]; then
              echo "No local image found for $image; expected it to have been built earlier in this job" >&2
              fail=1
              continue
            fi

            while IFS= read -r ref; do
              docker push "$ref" &
            done <<< "$refs"
          done

          for pid in $(jobs -p); do
            wait "$pid" || fail=1
          done

          exit "$fail"

  build-dt-core:
    runs-on: ubuntu-22.04
    needs: [determine_docker_org_and_tag, build-dt-base-general]
    env:
      DOCKER_ORG: ${{ needs.determine_docker_org_and_tag.outputs.docker_org }}
      DOCKER_TAG: ${{ needs.determine_docker_org_and_tag.outputs.docker_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to DT Docker registry
        uses: docker/login-action@v3
        with:
          registry: harbor.distributedtesting.org
          username: ${{ secrets.KEYCLOAK_USERNAME }}
          password: ${{ secrets.KEYCLOAK_TOKEN }}

      # See the equivalent step in build-dt-base-general: without this, BUILD_DIR is wiped every
      # run and every asset gets re-pulled from the same Drive file IDs, which is what trips
      # Drive's anonymous-link download quota.
      - name: Cache downloaded build assets
        uses: actions/cache@v4
        with:
          path: ~/distributed-testing/docker/build/lib/BUILD
          key: build-assets-${{ hashFiles('docker/build/build-assets.env') }}
          restore-keys: |
            build-assets-

      - name: Fetch required assets
        working-directory: ./docker/build
        run: |
          chmod +x fetch-assets.sh
          ./fetch-assets.sh build-assets.env
          source build-assets.env
          chmod -R a+rX "$BUILD_DIR"

      # dt-core_Dockerfile FROMs dt-base, and this job doesn't have it locally (it was built and
      # pushed in build-dt-base-general). Pulled with the classic client rather than left for
      # BuildKit to pull as part of `docker build`: BuildKit's own auth client can't complete
      # harbor.distributedtesting.org's OAuth exchange, unlike `docker pull` (see the equivalent
      # note in build-image.sh for dt-v2xhub's dt-build-general pull).
      - name: Pull dt-base image
        run: |
          docker pull "${DOCKERHUB_NAMESPACE}/${DOCKER_ORG}/dt-base:${DOCKER_TAG}"

      # buildTenaAdapters.sh sources ~/.dt_site_config and ~/.dt_scenario_config for
      # VUG_LOCAL_TENADEV_DIR / VUG_LOCAL_INSTALL_PATH, so they must exist on the runner.
      - name: Set DT site and scenario config
        run: |
          chmod +x config/set_dt_config.sh
          ./config/set_dt_config.sh --site default_site.config --scenario default_scenario.config

      # The adapter repos are private and cloned over SSH; rewrite to HTTPS + PAT so
      # the runner can clone them.
      - name: Configure git for private adapter repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"

      - name: Build all TENA adapters
        env:
          # Build against the dt-build-general image build-dt-base-general pushed. Not set
          # locally in this job, so buildTenaAdapters.sh pulls it from the registry.
          VUG_BUILD_GENERAL_IMAGE: harbor.distributedtesting.org/${{ needs.determine_docker_org_and_tag.outputs.docker_org }}/dt-build-general:${{ needs.determine_docker_org_and_tag.outputs.docker_tag }}
        run: |
          chmod +x scripts/build_tena_adapters/buildAllAdapters.sh scripts/build_tena_adapters/buildTenaAdapters.sh
          export TENA_BUILD_JOBS="$(nproc)"
          ./scripts/build_tena_adapters/buildAllAdapters.sh

      # dt-core COPYs lib/COPY into /home/dt_user, and .dt_site_config_docker points
      # VUG_LOCAL_INSTALL_PATH at $HOME/VUG_Adapters, so the built adapters go there.
      - name: Stage built adapters for dt-core
        run: |
          source ~/.dt_site_config
          rm -rf docker/build/lib/COPY/VUG_Adapters
          mkdir -p docker/build/lib/COPY/VUG_Adapters
          cp -a "$VUG_LOCAL_INSTALL_PATH/." docker/build/lib/COPY/VUG_Adapters/
          ls -la docker/build/lib/COPY/VUG_Adapters

      - name: Build dt-core image
        working-directory: ./docker/build
        run: |
          chmod +x build-image.sh
          ./build-image.sh core -v "$DOCKER_TAG"

      - name: Push dt-core to DT registry
        if: github.event_name != 'pull_request'
        run: |
          docker push "${DOCKERHUB_NAMESPACE}/${DOCKER_ORG}/dt-core:${DOCKER_TAG}"

  build-dt-v2xhub:
    runs-on: ubuntu-22.04
    needs: [determine_docker_org_and_tag, build-dt-base-general]
    env:
      DOCKER_ORG: ${{ needs.determine_docker_org_and_tag.outputs.docker_org }}
      DOCKER_TAG: ${{ needs.determine_docker_org_and_tag.outputs.docker_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to DT Docker registry
        uses: docker/login-action@v3
        with:
          registry: harbor.distributedtesting.org
          username: ${{ secrets.KEYCLOAK_USERNAME }}
          password: ${{ secrets.KEYCLOAK_TOKEN }}

      # build-image.sh pulls dt-build-general itself (with the classic client) when it isn't
      # already local, which is the case here since build-dt-base-general only pushed it to the
      # registry.
      - name: Build dt-v2xhub image
        working-directory: ./docker/build
        env:
          USDOTFHWASTOL_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          printf '%s' "$USDOTFHWASTOL_TOKEN" > usdotfhwastol_token
          chmod +x build-image.sh
          ./build-image.sh v2xhub -v "$DOCKER_TAG"
          rm -f usdotfhwastol_token

      # Pushed only after both images in this job built. Skipped on pull_request:
      - name: Push images to DT registry
        if: github.event_name != 'pull_request'
        run: |
          fail=0

          for image in dt-v2xhub dt-build-v2xhub; do
            repo="${DOCKERHUB_NAMESPACE}/${DOCKER_ORG}/${image}"
            refs=$(docker images --format '{{.Repository}}:{{.Tag}}' "$repo")

            if [[ -z "$refs" ]]; then
              echo "No local image found for $image; expected it to have been built earlier in this job" >&2
              fail=1
              continue
            fi

            while IFS= read -r ref; do
              docker push "$ref" &
            done <<< "$refs"
          done

          for pid in $(jobs -p); do
            wait "$pid" || fail=1
          done

          exit "$fail"

  build-dt-simdis:
    runs-on: ubuntu-22.04
    needs: [determine_docker_org_and_tag]
    env:
      DOCKER_ORG: ${{ needs.determine_docker_org_and_tag.outputs.docker_org }}
      DOCKER_TAG: ${{ needs.determine_docker_org_and_tag.outputs.docker_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to DT Docker registry
        uses: docker/login-action@v3
        with:
          registry: harbor.distributedtesting.org
          username: ${{ secrets.KEYCLOAK_USERNAME }}
          password: ${{ secrets.KEYCLOAK_TOKEN }}
      # See the equivalent step in build-dt-images: without this, BUILD_DIR is wiped every run
      # and every asset gets re-pulled from the same Drive file IDs, which is what trips
      # Drive's anonymous-link download quota.
      - name: Cache downloaded build assets
        uses: actions/cache@v4
        with:
          path: ~/distributed-testing/docker/build/lib/BUILD
          key: build-assets-simdis-${{ hashFiles('docker/build/build-assets_simdis.env') }}
          restore-keys: |
            build-assets-simdis-

      - name: Fetch required assets
        working-directory: ./docker/build
        run: |
          chmod +x fetch-assets.sh
          ./fetch-assets.sh build-assets_simdis.env
          source build-assets_simdis.env
          chmod -R a+rX "$BUILD_DIR"

      - name: Build dt-simdis image
        working-directory: ./docker/build
        run: |
          chmod +x build-image.sh
          ./build-image.sh simdis -v "$DOCKER_TAG"

      - name: Push dt-simdis to DT registry
        if: github.event_name != 'pull_request'
        run: |
          docker push "${DOCKERHUB_NAMESPACE}/${DOCKER_ORG}/dt-simdis:${DOCKER_TAG}"
