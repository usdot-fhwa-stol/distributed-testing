#TwoWayTimeout 


#################################################
#
# Sometimes it is desirable for hosts with more
# than one network interface to use a non-default
# network interface to transmit IP multicast data
# (i.e., when using TENA::Middleware::BestEffort).
# On UNIX operating systems, setting this option to
# the name of a network interface (e.g., "eth0")
# will cause that interface to be used for multicast
# traffic. On Windows operating systems, this option
# must be set to the hostname or IP address of the
# desired network interface
#
#MulticastInterface 


#################################################
#
# When using TENA::Middleware::BestEffort, i.e.,
# IP multicast, to transmit data across multiple
# LANs, the routers that control the exchange of data
# between the LANs must be configured to pass IP
# multicast. As a protection against mistaken router
# configurations (e.g., router loops), every IP
# multicast datagram is tagged with a Time to Live
# (TTL) value. The TTL value is decremented every time
# an IP multicast datagram reaches a router. If the TTL
# value is <= 1, then the router will drop the datagram.
# Thus, the TTL value reflects the number of LANs that
# a given datagram will traverse, i.e., the number of
# "hops" the datagram will make. The following conventions
# exist for use as TTL scope control by multicast
# routers: 0 will restrict to the same host, 1 will
# restrict to the same subnet, 32 will restrict to the
# same site, 64 will restrict to the same region, 128
# will restrict to the same continent, and 255 will be
# unrestricted in scope. Unfortunately, "site", "region",
# and "continent" are not strictly defined. Consequently,
# TENA recommends that multicastTTL be set to the number of
# subnets used by the execution. Multicast routers do not
# forward multicast datagrams with a destination address
# between 224.0.0.0 and 224.0.0.255 inclusive, regardless
# of its TTL. This range of addresses is reserved for the
# use of routing protocols and other low-level topology
# discovery or maintenance protocols, such as gateway
# discovery and group membership reporting. Legal values
# are 0 <= multicastTTL <= 255.
#
#MulticastTTL 


#################################################
#
# This parameter controls the size, in bytes, of
# the operating system (OS) buffer used to hold data
# received on an IP multicast socket. Since IP
# multicast is "best effort" (i.e., unreliable),
# if data arrives faster than it is processed, then
# the buffer will be overrun and data will be lost
# in some OS-specific way (most OSes will discard the
# entire buffer). Legal values are 1024 <=
# multicastReceiveBufferSize <= 8388608, i.e., from
# 1 KB to 8 MB.
#
#MulticastReceiveBufferSize 


#################################################
#
# This parameter controls the size, in bytes, of
# the operating system (OS) buffer used to hold data
# to be transmitted on an IP multicast socket. Since
# IP multicast is "best effort" (i.e., unreliable),
# attempts to transmit data faster than the network
# can support will result in a buffer overrun and
# data will be lost in some OS-specific way (most
# OSes will discard the entire buffer). Legal values
# are 1024 <= multicastSendBufferSize <= 8388608, i.e.,
# from 1 KB to 8 MB.
#
#MulticastSendBufferSize 


#################################################
#
# This parameter controls the maximum size, in bytes,
# of "best effort" network packets. Larger tranmission
# attempts will fragment the data into multiple network
# packets.
#
#BestEffortFragmentSize 


#################################################
#
# When a subscribing application declares their interest
# in a type of object, there is no means to determine
# how long it will take for that interest information
# to be reflected back in an application that publishes
# that type. Generally, only a "very small" amount of
# time is required. Regardless of the time required,
# a race condition exists. Starting the subscribing
# application before starting the publishing application
# does not guarantee that the subscriber's interest
# will be reflected in the publishing application
# before it creates and updates an object of the
# given type. When this happens, the subscriber will
# "miss out" on the initial update(s) to the newly
# created object. This parameter exists to mitigate
# this race condition by allowing more time for
# subscriber interests to arrive at the publishing
# application before it creates the first (and only
# the first) object instance of a given type.
# units: seconds.
#
#DispatchDuration 


#################################################
#
# Transient communication errors are an unfortunate
# occurance in any networked computer system. TENA
# executions are no exception. When a transient error
# occurs during a network operation, a decision must
# be made about how many times to re-try the operation.
# This option controls the number of tries to make
# before failing. 
# Legal values are 0 <= transientCommunicationAttempts.
#
#TransientCommunicationAttempts 


#################################################
#
# Some TENA executions contain applications that
# frequently terminate abnormally (e.g., due to
# Control-c, or a crash, etc.). In early releases
# of the TENA Middleware, this would result in "long"
# delays while joining or resigning from the TENA
# execution. This was a result of re-trying network
# operations that generated errors due to the abnormally
# terminated applications (see transientCommunicationAttempts,
# above). This option is similar to transientCommunicationAttempts
# but is specific to the number of re-tries to be made
# when network errors arise due to abnormally terminated
# applications (as opposed to momentary network glitches).
# In this specific case, it is reasonable to not retry.
# Legal values are 0 <= announceTransientAttempts.
#
#AnnounceTransientAttempts 


